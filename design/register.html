<body class="font-body-md text-on-surface">
<!-- Main Registration Canvas -->
<main class="min-h-screen flex flex-col items-center justify-center p-lg">
<!-- Branding Anchor -->
<div class="mb-xl text-center">
<h1 class="font-h1 text-h1 tracking-tighter text-primary">ARCHETYPE</h1>
<p class="font-body-sm text-body-sm text-secondary mt-sm">Precision Engineering for Enterprise Systems</p>
</div>
<!-- Registration Card -->
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-surface-container p-xl rounded-lg">
<header class="mb-xl">
<h2 class="font-h2 text-h2 text-primary">Create Account</h2>
<p class="font-body-sm text-body-sm text-secondary mt-xs">Enter your details to register for the platform.</p>
</header>
<form class="space-y-lg">
<!-- Name Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm uppercase" for="name">Full Name</label>
<input class="w-full h-11 px-md bg-surface-container-lowest border border-surface-container-high rounded font-body-md text-body-md form-focus-ring placeholder:text-outline" id="name" name="name" placeholder="John Doe" type="text"/>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm uppercase" for="email">Work Email</label>
<input class="w-full h-11 px-md bg-surface-container-lowest border border-surface-container-high rounded font-body-md text-body-md form-focus-ring placeholder:text-outline" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
<!-- Password Fields Grid -->
<div class="grid grid-cols-1 gap-lg">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm uppercase" for="password">Password</label>
<div class="relative">
<input class="w-full h-11 px-md bg-surface-container-lowest border border-surface-container-high rounded font-body-md text-body-md form-focus-ring placeholder:text-outline" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm uppercase" for="confirm_password">Confirm Password</label>
<input class="w-full h-11 px-md bg-surface-container-lowest border border-surface-container-high rounded font-body-md text-body-md form-focus-ring placeholder:text-outline" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms/Privacy -->
<div class="flex items-start gap-sm">
<input class="mt-1 w-4 h-4 border border-outline rounded-xs text-primary focus:ring-0" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-secondary" for="terms">
                        I agree to the <a class="text-primary font-medium hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-medium hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Action Button -->
<div class="pt-md">
<button class="w-full h-12 bg-primary text-on-primary font-body-md text-body-md font-semibold rounded hover:bg-opacity-90 transition-all duration-200" type="submit">
                        Create Account
                    </button>
</div>
</form>
<!-- Login Redirect -->
<footer class="mt-xl pt-lg border-t border-surface-container flex justify-center">
<p class="font-body-sm text-body-sm text-secondary">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Log in</a>
</p>
</footer>
</div>
<!-- Decorative Security Badge -->
<div class="mt-xl flex items-center gap-sm text-on-tertiary-container opacity-60">
<span class="material-symbols-outlined text-[18px]" data-icon="verified_user">verified_user</span>
